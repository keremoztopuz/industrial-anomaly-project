name: CI Workflow for Industrial Anomaly Detection MLOps

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest tests/test_validate_dataset.py
          pytest tests/test_dataset_summary.py
          pytest tests/test_patchcore.py
          pytest tests/test_mvtec_dataset.py
