name: CI Workflow for Industrial Anomaly Detection MLOps

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-ci.lock

      - name: Install dependencies
        run: |
          pip install --only-binary=:all: --require-hashes -r requirements-ci.lock

      - name: Run tests
        run: python -m pytest tests

      - name: Lint
        run: python -m flake8 anomaly api scripts tests

      - name: Audit locked dependencies
        run: |
          python -m pip_audit --no-deps --disable-pip -r requirements-api.lock
          python -m pip_audit --no-deps --disable-pip -r requirements-ci.lock
          # Public release advisories also cover the +cpu wheel versions skipped by PyPI.
          python -m pip_audit --no-deps --disable-pip -r requirements.txt
